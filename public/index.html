<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="shortcut icon" href="/favicon.ico">

    <title>Great Divide Elevation Map</title>
    <meta name="description" content="Draw elevation profiles for the Great Divide Mountain Bike Route and Tour Divide route." />
    <meta name="keywords" content="great divide elevation profile gdmbr adventure cycling aca bikepacking eat sleep ride" />

    <link href="assets/build/css/style.css" rel="stylesheet">
    <script src="//maps.googleapis.com/maps/api/js?key=AIzaSyCej-mrOPruKdNFs6FUoH-oyeWHH5t9TAA&libraries=geometry"></script>

    <script>
        (function(i,s,o,g,r,a,m){i['GoogleAnalyticsObject']=r;i[r]=i[r]||function(){
                (i[r].q=i[r].q||[]).push(arguments)},i[r].l=1*new Date();a=s.createElement(o),
            m=s.getElementsByTagName(o)[0];a.async=1;a.src=g;m.parentNode.insertBefore(a,m)
        })(window,document,'script','//www.google-analytics.com/analytics.js','ga');

        ga('create', 'UA-8215888-11', 'auto');
        ga('send', 'pageview');
    </script>

</head>
<body class="pages-map">
    <nav class="navbar navbar-default navbar-fixed-top" id="top-nav">
        <div class="container">
            <div class="navbar-header">
                <button type="button" class="navbar-toggle collapsed" data-toggle="collapse" data-target="#navbar" aria-expanded="false" aria-controls="navbar">
                    <span class="sr-only">Toggle navigation</span>
                    <span class="icon-bar"></span>
                    <span class="icon-bar"></span>
                    <span class="icon-bar"></span>
                </button>
                <a class="navbar-brand" href="/">Great Divide Elevation Map</a>
            </div>
            <div id="navbar" class="navbar-collapse collapse">
                <ul class="nav navbar-nav navbar-right">
                    <li>
                        <a href="about.html">About</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div id="app">
        <div class="container-fluid">
            <div class="row">
                <div class="col-lg-12">
                    <div role="tabpanel">

                        <!-- Nav tabs -->
                        <ul class="nav nav-tabs" role="tablist">
                            <li role="presentation" class="active">
                                <a href="#profile-tab" aria-controls="profile-tab" role="tab" data-toggle="tab">Profile + Stats</a>
                            </li>
                            <li class="pull-right">
                                <form class="form-inline">
                                    <div clas="form-group">
                                        <label for="#route-select">Current Route:</label>
                                        <select class="form-control input-sm" id="route-select">
                                            <optgroup label="Great Divide">
                                                <option value="GDMBR-2011v1">GDMBR-2011v1</option>
                                            </optgroup>
                                            <optgroup label="Tour Divide">
                                                <option value="TD-2018v1" selected="SELECTED">TD-2018v1</option>
                                                <option value="TD-2017v1">TD-2017v1</option>
                                                <option value="TD-2016v2">TD-2016v2</option>
                                                <option value="TD-2016v1">TD-2016v1</option>
                                                <option value="TD-2015v2">TD-2015v2</option>
                                                <option value="TD-2015v1">TD-2015v1</option>
                                                <option value="TD-2014v1">TD-2014v1</option>
                                            </optgroup>
                                        </select>
                                    </div>
                                </form>
                            </li>
                        </ul>

                        <!-- Tab panes -->
                        <div class="tab-content">

                            <div role="tabpanel" class="tab-pane active" id="profile-tab">
                                <div class="container-fluid">
                                    <div class="row">
                                        <div class="col-sm-3 col-lg-2">
                                            <div class="form">
                                                <div class="form-group">
                                                    <select name="direction" class="form-control">
                                                        <option value="">Choose Direction</option>
                                                        <option value="forward" selected>Southbound</option>
                                                        <option value="reverse">Northbound</option>
                                                    </select>
                                                </div>
                                            </div>
                                            <div id="segment-stats-container">Loading...</div>
                                        </div>
                                        <div class="col-sm-9 col-lg-10">
                                            <svg id="elevation-profile"></svg>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div id="map"></div>

    <div class="modal fade" id="download-modal">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h4 class="modal-title">Downloading Track...</h4>
                </div>
                <div class="modal-body">
                    <p>
                        This may take a few moments.
                    </p>
                    <div class="progress">
                        <div class="progress-bar progress-bar-success progress-bar-striped" role="progressbar" aria-valuenow="10" aria-valuemin="0" aria-valuemax="100" style="min-width: 2em;">0%</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script id="segment-stats-template" type="text/x-handlebars-template">
        <div class="form-horizontal">

        </div>
        <dl class="dl-horizontal">
            <dt>Distance</dt>
            <dd>{{stats.distance}} mi</dd>

            <dt>Ascent</dt>
            <dd>{{stats.ascent}} ft</dd>

            <dt>Descent</dt>
            <dd>{{stats.descent}} ft</dd>

            <dt>Net Elevation</dt>
            <dd>{{stats.netElevation}} ft</dd>

            <dt>Miles</dt>
            <dd>{{stats.startMile}} - {{stats.endMile}}</dd>
        </dl>
    </script>

    <script>
        window.appConfig = {
            "routeGroups": {
                "Great Divide": [
                    {
                        "id": "GDMBR-2011v1",
                        "gpxFile": "assets/route-gpx/GDMBR2011_v1.gpx ",
                        "routeDataFile": "assets/route-json/GDMBR2011_v1-route.json"
                    }
                ],
                "Tour Divide": [
                    {
                        "id": "TD-2018v1",
                        "gpxFile": "assets/route-gpx/TourDivide2018_v1.gpx",
                        "routeDataFile": "assets/route-json/TourDivide2018_v1-route.json"
                    },
                    {
                        "id": "TD-2017v1",
                        "gpxFile": "assets/route-gpx/TourDivide2017_v1.gpx",
                        "routeDataFile": "assets/route-json/TourDivide2017_v1-route.json"
                    },
                    {
                        "id": "TD-2016v2",
                        "gpxFile": "assets/route-gpx/TourDivide2016_v2.gpx",
                        "routeDataFile": "assets/route-json/TourDivide2016_v2-route.json"
                    },
                    {
                        "id": "TD-2016v1",
                        "gpxFile": "assets/route-gpx/TourDivide2016_v1.gpx",
                        "routeDataFile": "assets/route-json/TourDivide2016_v1-route.json"
                    },
                    {
                        "id": "TD-2015v2",
                        "gpxFile": "assets/route-gpx/TourDivide2015_v2.gpx",
                        "routeDataFile": "assets/route-json/TourDivide2015_v2-route.json"
                    },
                    {
                        "id": "TD-2015v1",
                        "gpxFile": "assets/route-gpx/TourDivide2015_v1.gpx",
                        "routeDataFile": "assets/route-json/TourDivide2015_v1-route.json"
                    },
                    {
                        "id": "TD-2014v1",
                        "gpxFile": "assets/route-gpx/TourDivide2014_v1.gpx",
                        "routeDataFile": "assets/route-json/TourDivide2014_v1-route.json"
                    }
                ]
            }
        }
    </script>

    <script src="assets/build/js/libs.js"></script>
    <script src="assets/build/js/app.js"></script>
</body>
</html>
